name: Inquiry backend checks
on:
  push:
    branches: [main, feat/django-inquiry-emails]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cronoverse
          POSTGRES_USER: cronoverse
          POSTGRES_PASSWORD: local-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cronoverse -d cronoverse"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DJANGO_DEBUG: '1'
      DATABASE_URL: postgresql://cronoverse:local-ci-only@localhost:5432/cronoverse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: python backend/manage.py check
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py test inquiries --verbosity 2
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:inquiries
      - run: pnpm typecheck
      - run: pnpm build
